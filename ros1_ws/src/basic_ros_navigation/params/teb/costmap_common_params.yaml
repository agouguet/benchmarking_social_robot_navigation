map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: true
transform_tolerance: 0.5
meter_scoring: true

footprint: [[-0.12,-0.12],[-0.12,0.12], [0.12, 0.12], [0.12,-0.12]]
footprint_padding: 0.1


observation_sources: laser_scan_sensor

laser_scan_sensor: 
  sensor_frame: laser_link
  data_type: LaserScan
  topic: scan
  marking: true 
  clearing: true
