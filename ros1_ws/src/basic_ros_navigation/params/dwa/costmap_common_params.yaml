map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: true
transform_tolerance: 0.5
meter_scoring: true

footprint: [[-0.12,-0.12],[-0.12,0.12], [0.12, 0.12], [0.12,-0.12]]
footprint_padding: 0.1

static_layer:
  map_topic: /map
  subscribe_to_updates: true

obstacle_layer:
  observation_sources: laser #depth

  laser:
    topic: scan
    sensor_frame: laser
    observation_persistence: 0.0
    expected_update_rate: 5.0
    data_type: LaserScan
    clearing: true
    marking: true
    max_obstacle_height: 20.0
    min_obstacle_height: -20.0
    obstacle_range: 4.0
    raytrace_range: 6.0

inflated_layer:
  inflation_radius: 0.15
  cost_scaling_factor: 3.0

